<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tasca</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: iOS grouped app — sticky blurred top bar, large title, inset cards, sheets from the bottom, tab bar */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#ECECF1; --fg:#0B0B0F; --fg2:rgba(60,60,67,.64); --fg3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.22); --pill:#FFFFFF;
  --accent:#0A7E8C; --accent-soft:rgba(10,126,140,.11); --on-accent:#FFFFFF;
  --pos:#1E9E4A; --neg:#E0322B; --warn:#D97F00;
  --bar-bg:rgba(246,246,250,.8); --shadow:0 1px 2px rgba(20,20,40,.04),0 6px 20px rgba(20,20,40,.05);
  --hero1:#0B8494; --hero2:#0A5160; --toast-bg:#1C1C1E; --toast-fg:#FFFFFF; --toast-acc:#64D2FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.38); --pill:#636366;
  --accent:#45CCD9; --accent-soft:rgba(69,204,217,.15); --on-accent:#00262B;
  --pos:#32D35A; --neg:#FF5147; --warn:#FFA51F;
  --bar-bg:rgba(22,22,24,.78); --shadow:none;
  --hero1:#0C6A77; --hero2:#06343D; --toast-bg:#F2F2F7; --toast-fg:#000000; --toast-acc:#0A7E8C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.38); --pill:#636366;
  --accent:#45CCD9; --accent-soft:rgba(69,204,217,.15); --on-accent:#00262B;
  --pos:#32D35A; --neg:#FF5147; --warn:#FFA51F;
  --bar-bg:rgba(22,22,24,.78); --shadow:none;
  --hero1:#0C6A77; --hero2:#06343D; --toast-bg:#F2F2F7; --toast-fg:#000000; --toast-acc:#0A7E8C; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));transition:transform .5s var(--ease),border-radius .5s var(--ease),filter .5s var(--ease)}
.app.behind{transform:scale(.94);border-radius:16px;filter:brightness(.9);overflow:hidden}
#view{display:flex;flex-direction:column;gap:18px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;height:52px;
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .25s,box-shadow .25s}
.topbar.scrolled{background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.topbar-title{font-weight:600;font-size:17px;opacity:0;transform:translateY(6px);transition:opacity .3s var(--ease),transform .3s var(--ease);white-space:nowrap}
.topbar.scrolled .topbar-title{opacity:1;transform:none}
.tb-r{justify-self:end;display:flex;align-items:center;gap:10px}
.sync-dot{width:30px;height:30px;display:grid;place-items:center;color:var(--fg3);position:relative;border-radius:50%}
.sync-dot svg{width:22px;height:22px}
.sync-dot::after{content:"";position:absolute;right:3px;bottom:5px;width:8px;height:8px;border-radius:50%;background:var(--fg3);box-shadow:0 0 0 2px var(--bg)}
.sync-dot[data-s="ok"]{color:var(--accent)}.sync-dot[data-s="ok"]::after{background:var(--pos)}
.sync-dot[data-s="offline"]::after,.sync-dot[data-s="connecting"]::after{background:var(--warn)}
.sync-dot[data-s="error"]::after,.sync-dot[data-s="full"]::after{background:var(--neg)}
.sync-dot[data-s="local"]{display:none}
.sync-dot[data-s="setup"]::after{background:var(--fg3)}
.sync-dot[data-s="auth"]::after,.sync-dot[data-s="server"]::after{background:var(--neg)}
.sync-st{flex:1;text-align:right;color:var(--fg2)}
.mnav{display:inline-flex;align-items:center;background:var(--fill);border-radius:999px;height:34px;font-size:14px;font-weight:600}
.mnav button{width:34px;height:34px;display:grid;place-items:center;color:var(--accent);border-radius:50%;transition:transform .2s var(--spring)}
.mnav button:active{transform:scale(.85)}
.mnav span{min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.mnav svg{width:16px;height:16px}
.addbtn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:transform .25s var(--spring)}
.addbtn svg{width:18px;height:18px}
.addbtn:active{transform:scale(.88)}

.ltitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:-4px}
.ltitle h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.ltitle .when{color:var(--fg2);font-size:15px;font-weight:500}

.press{transition:transform .25s var(--spring)}
.press:active{transform:scale(.97)}

/* hero */
.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#FFFFFF;border-radius:24px;padding:20px;display:grid;gap:18px;position:relative;overflow:hidden;box-shadow:0 14px 30px -14px rgba(8,80,92,.55)}
.hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-80px;top:-110px;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
.hero-main{display:flex;justify-content:space-between;align-items:center;gap:14px;position:relative}
.hero-l{min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;font-weight:600}
.hero-num{font-family:var(--round);font-size:clamp(32px,9.5vw,44px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0 4px;white-space:nowrap}
.hero-sub{font-size:13px;opacity:.82}
.hero-ring{position:relative;flex:none;display:grid;place-items:center}
.hero .ring-bg{stroke:rgba(255,255,255,.2)}
.hero .ring-fg{stroke:#FFFFFF}
.ring-lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring-lbl b{font-size:17px;font-variant-numeric:tabular-nums}
.ring-lbl span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.hero-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.18);padding-top:14px;position:relative}
.hero-flow small{display:block;opacity:.75;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.hero-flow b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring-bg{stroke:var(--fill)}
.ring-fg{stroke:var(--accent);transition:stroke-dasharray 1.1s var(--ease)}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtn{background:var(--card);border-radius:18px;padding:12px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:600;box-shadow:var(--shadow);text-align:center}
.qbtn .ico{width:34px;height:34px;border-radius:11px}

/* cards & lists */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.card-h h2{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.card-h .link{color:var(--accent);font-size:15px}
.card-h .note{color:var(--fg2);font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 4px}
.metrics>div{padding:0 12px;min-width:0}
.metrics>div+div{border-left:.5px solid var(--sep)}
.metrics small,.lbl{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px;line-height:1.25}
.metrics b{font-size:17px;font-variant-numeric:tabular-nums;font-family:var(--round)}
.neg{color:var(--neg)} .pos{color:var(--pos)} .acc{color:var(--accent)}

.list{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.card .list{box-shadow:none;margin:0 -16px -16px;border-radius:0 0 20px 20px}
.swipe{position:relative;overflow:hidden;background:var(--neg)}
.swipe.gone{transition:height .3s var(--ease),opacity .25s;opacity:0}
.swipe-del{position:absolute;right:0;top:0;bottom:0;width:88px;color:#FFFFFF;font-weight:600;font-size:15px;text-align:center}
.swipe-front{position:relative;z-index:1;background:var(--card);transition:transform .4s var(--ease);touch-action:pan-y}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:62px;position:relative;cursor:pointer;transition:background .15s;-webkit-user-select:none;user-select:none}
.row:active{background:var(--card2)}
.swipe:not(:last-child) .row::after{content:"";position:absolute;left:64px;right:0;bottom:0;height:.5px;background:var(--sep)}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.row-main{flex:1;min-width:0}
.row-title{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}

.sec{display:flex;justify-content:space-between;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);margin:0 16px 7px}
.sec span:last-child{font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.days{display:flex;flex-direction:column;gap:20px}
.foot{font-size:13px;color:var(--fg2);margin:8px 16px 0;line-height:1.4}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:16px;padding:12px 14px;font-size:14px;flex-wrap:wrap}
.banner.warn{background:rgba(224,50,43,.1)}
.btn-sm{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}

.empty{text-align:center;padding:26px 20px;color:var(--fg2);font-size:15px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.empty .ico{margin:0 auto 12px;width:48px;height:48px;border-radius:15px;background:var(--fill)}
.empty .ico svg{stroke:var(--fg2);width:24px;height:24px}

/* donut + legend */
.donut-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.donut-wrap{position:relative;width:150px;height:150px}
.donut-wrap svg{width:100%;height:100%;display:block}
.donut-wrap circle[data-dash]{transition:stroke-dasharray .9s var(--ease)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c small{font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.donut-c b{font-family:var(--round);font-size:19px;font-variant-numeric:tabular-nums}
.legend{display:grid;gap:11px;min-width:0}
.lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;column-gap:8px;row-gap:5px;font-size:14px;width:100%}
.lg .dot{width:10px;height:10px;border-radius:50%}
.lg .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .v{font-variant-numeric:tabular-nums;font-weight:600}
.lg .v em{font-style:normal;font-weight:400;color:var(--fg2);font-size:12px;margin-left:4px}
.lg .bar{grid-column:2/4;height:5px;background:var(--fill);border-radius:3px;overflow:hidden}
.bar i,.prog i{display:block;height:100%;border-radius:inherit;width:0;transition:width .9s var(--ease)}
@media (max-width:440px){.donut-row{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--fg2);font-size:10.5px;font-family:var(--font);font-variant-numeric:tabular-nums}
.chart text.cur{fill:var(--fg);font-weight:700}
.gridl{stroke:var(--sep);stroke-width:1;stroke-dasharray:2 3}
.gridl.base{stroke-dasharray:none}
.vbar.dim{opacity:.55}
.go .vbar.dim{opacity:.55}
.line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s var(--ease)}
.go .line{stroke-dashoffset:0}
.area{opacity:0;transition:opacity .8s .35s}
.go .area{opacity:1}
.enddot{fill:var(--accent);stroke:var(--card);stroke-width:2.5;opacity:0;transition:opacity .3s 1s}
.go .enddot{opacity:1}
.budget-l{stroke:var(--warn);stroke-dasharray:4 4;stroke-width:1.5}
.chart text.budget-t{fill:var(--warn);font-weight:600}
.vbar{transform:scaleY(0);transform-box:fill-box;transform-origin:50% 100%;transition:transform .75s var(--spring)}
.go .vbar{transform:scaleY(1)}
.keys{display:flex;gap:16px;font-size:13px;color:var(--fg2);margin-top:10px;flex-wrap:wrap}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* spese summary */
.sum-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.big{font-family:var(--round);font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill-neg{color:var(--neg);background:rgba(224,50,43,.12)}
.pill-pos{color:var(--pos);background:rgba(30,158,74,.13)}
.prog{height:8px;background:var(--fill);border-radius:4px;overflow:hidden;margin-top:14px}
.prog i{background:var(--accent)}
.prog i.over{background:var(--neg)}
.prog-lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2);margin-top:6px;font-variant-numeric:tabular-nums}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio>div{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);min-width:0}
.trio b{font-family:var(--round);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}

.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:11px;padding:0 10px;height:40px;color:var(--fg2)}
.search svg{width:17px;height:17px;flex:none}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;font-size:16px;color:var(--fg);-webkit-appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:-2px -2px -4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:500;box-shadow:var(--shadow);transition:background .25s,color .25s,transform .25s var(--spring);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--fg);color:var(--bg)}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* risparmi */
.sal{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px}
.sal .row-main{min-width:0}
.sal .row-title,.sal .row-sub{white-space:normal}
.sal .row-title{font-weight:600}
.sal .row-amt{font-family:var(--round);font-size:19px}
.sal.todo{background:var(--accent-soft);box-shadow:none}
.est{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:rgba(217,127,0,.13);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.drow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:10px;padding:12px 16px;position:relative}
.drow .dbtns{grid-column:2/4}
.drow .dbtns .btn{flex:1;text-align:center}
.drow .row-title{font-weight:600}
.drow+.drow::before{content:"";position:absolute;top:0;left:64px;right:0;height:.5px;background:var(--sep)}
.dbtns{display:flex;gap:6px;flex:none}
.btn.sm{padding:7px 12px;font-size:14px}
.due-h{color:var(--warn)}
.quick.q4{grid-template-columns:repeat(4,1fr)}
.goal{display:flex;align-items:center;gap:18px;width:100%}
.goal-ring{position:relative;flex:none;display:grid;place-items:center}
.goal-ring .ring-lbl b{font-size:22px;font-family:var(--round)}
.goal-ring .ring-lbl span{color:var(--fg2)}
.goal h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.goal p{margin:2px 0;color:var(--fg2);font-size:14px}
.goal p b{color:var(--fg);font-variant-numeric:tabular-nums}
.goal .edit{color:var(--accent);font-size:14px;margin-top:8px;display:inline-block}
@media (max-width:380px){.goal{flex-direction:column;align-items:flex-start}}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 7px;font-size:10.5px;font-weight:500;color:var(--fg2);text-align:center}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}
.tab.on svg{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.72)}100%{transform:scale(1)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .45s var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:640px;height:calc(100% - 44px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:16px 16px 0 0;z-index:50;
  transform:translateY(105%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:8px auto 0;flex:none}
.sheet-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:46px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:none;flex:none}
.sheet-nav h2{font-size:17px;font-weight:600;margin:0;text-align:center}
.sheet-nav button{color:var(--accent);font-size:17px}
.sheet-nav .strong{font-weight:600;justify-self:end}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;flex:1}
.sheet-body>*{flex-shrink:0}
#view>*{min-width:0}
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:10px 0 2px}
.amount .cur{font-family:var(--round);font-size:30px;color:var(--fg2);font-weight:600}
.amount input{font-family:var(--round);font-size:52px;font-weight:700;border:0;background:transparent;text-align:left;width:4.4ch;max-width:85%;outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:0;caret-color:var(--accent)}
.amount input::placeholder{color:var(--fg3)}
.amount.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.form{background:var(--card);border-radius:12px;overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px;position:relative}
.field+.field::before,.form>.srow+.srow::before,.form>.srow+.field::before,.form>.field+.srow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.field>span{flex:none;font-size:16px}
.field input{flex:1;min-width:0;border:0;background:transparent;text-align:right;font-size:16px;color:var(--fg2);outline:none;padding:12px 0;-webkit-appearance:none;appearance:none}
.field input[type=date]{min-height:24px;display:flex;justify-content:flex-end}
.field input::-webkit-date-and-time-value{text-align:right}
.field.col{flex-direction:column;align-items:stretch;padding:12px 16px;gap:6px}
.field textarea{border:0;background:transparent;resize:vertical;outline:none;font-size:16px;min-height:66px;padding:0}
.field.sw>span{flex:1}
.switch{display:block;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .25s;flex:none;cursor:pointer;margin:0;padding:0;border:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .35s var(--spring)}
.switch.on{background:var(--pos)}
.switch.on::after{transform:translateX(20px)}
.switch:active::after{width:31px}
.switch.on:active::after{transform:translateX(16px)}
.freq-box{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.freq-box.open{grid-template-rows:1fr}
.freq-box>div{overflow:hidden;min-height:0}
.freq-in{padding:4px 16px 14px;display:grid;gap:10px}
.freq-in .lbl{margin:0}
.freq-next{font-size:13px;color:var(--fg2)}
.freq-next b{color:var(--fg)}
.rec-total{font-family:var(--round);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.lbl-sec{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);margin:0 16px -12px}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--fill);border-radius:10px;padding:2px;isolation:isolate}
.seg button{position:relative;z-index:1;padding:8px 4px;font-size:14px;font-weight:500;border-radius:8px;text-align:center;transition:color .2s}
.seg button.on{font-weight:600}
.seg-pill{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));background:var(--pill);border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transform:translateX(calc(var(--i)*100%));transition:transform .4s var(--ease);z-index:0}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--fg2);text-align:center;line-height:1.2}
.cat .ico{width:48px;height:48px;border-radius:15px;transition:transform .3s var(--spring),box-shadow .25s}
.cat .ico svg{width:24px;height:24px}
.cat.on{color:var(--fg);font-weight:600}
.cat.on .ico{transform:scale(1.08);box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--c)}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.form-err{color:var(--neg);font-size:14px;text-align:center;margin:0;min-height:1em}
.danger{width:100%;background:var(--card);color:var(--neg);border-radius:12px;padding:14px;font-size:16px;font-weight:500;text-align:center}

/* settings */
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:0 16px;min-height:50px;font-size:16px;color:var(--accent);cursor:pointer;position:relative;text-align:left}
.srow.red{color:var(--neg)}
.srow .chev{color:var(--fg3)}
.srow .chev svg{width:14px;height:14px}
.boxed{width:100%;min-height:110px;border:0;border-radius:12px;background:var(--card);padding:12px 14px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2);resize:vertical;outline:none}
details.paste{margin-top:12px}
details.paste summary{cursor:pointer;color:var(--accent);font-size:15px;margin:0 16px 10px;list-style:none}
details.paste summary::-webkit-details-marker{display:none}
.confirm{display:grid;gap:12px;margin-top:12px}
.confirm p{margin:0}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border-radius:999px;padding:9px 16px;font-weight:600;background:var(--fill);font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-180%);z-index:70;background:var(--toast-bg);color:var(--toast-fg);border-radius:999px;padding:11px 18px;display:flex;gap:14px;align-items:center;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.22);transition:transform .55s var(--spring);max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}
.toast button{color:var(--toast-acc);font-weight:700}

/* entrance */
.enter>*:not(.topbar){animation:rise .55s var(--ease) both;animation-delay:calc(var(--k,0)*45ms)}
.enter .swipe{animation:rise .5s var(--ease) both;animation-delay:calc(var(--r,0)*28ms + 140ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}}

    area=`<path class="area" d="M${X(1)},${Y(0)}L${pts.join('L')}L${X(last)},${Y(0)}Z" style="fill:url(#ag)"/>`;
    dot=`<circle class="enddot" cx="${X(last)}" cy="${Y(cum[last])}" r="4.5"/>`}
  const bl=B?`<line class="budget-l" x1="${pl}" x2="${W-pr}" y1="${Y(B)}" y2="${Y(B)}"/><text class="budget-t" x="${pl+4}" y="${Y(B)-6}">Budget ${short(B)}</text>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spesa accumulata giorno per giorno"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>${g}${xt}${bl}${area}${line}${dot}</svg></div>`;
}
function barsChart(ms,series,colors,label){
  const W=340,H=170,pl=42,pr=4,pt=10,pb=22;
  const {step,n:nt,max}=scaleOf(Math.max(10,...series.flat())*1.04);
  const Y=v=>pt+(1-v/max)*(H-pt-pb),gw=(W-pl-pr)/ms.length,ns=series.length,gp=4,bw=Math.min(ns>1?14:26,(gw-16-(ns-1)*gp)/ns);
  let g='';for(let k=0;k<=nt;k++){const y=Y(step*k);g+=`<line class="gridl${k?'':' base'}" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-7}" y="${y+3.5}" text-anchor="end">${short(step*k)}</text>`}
  let b='';ms.forEach((m,i)=>{const cx=pl+gw*i+gw/2,x0=cx-(ns*bw+(ns-1)*gp)/2;
    series.forEach((ser,j)=>{const v=ser[i];if(v>0){const y=Y(v),h=Y(0)-y;b+=`<path class="vbar${m===month?'':' dim'}" d="${barPath(+(x0+j*(bw+gp)).toFixed(1),+y.toFixed(1),+bw.toFixed(1),+h.toFixed(1),5)}" style="fill:${colors[j]};transition-delay:${i*70+j*35}ms"><title>${MSHORT[mIdx(m)]}: ${fmt(v)}</title></path>`}});
    b+=`<text x="${cx}" y="${H-5}" text-anchor="middle" class="${m===month?'cur':''}">${MSHORT[mIdx(m)]}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${g}${b}</svg></div>`;
}

function runAnims(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$('[data-dash]',root).forEach((c,i)=>{c.style.transitionDelay=(i*70)+'ms';c.style.strokeDasharray=c.dataset.dash});
    $$('.chart',root).forEach(c=>c.classList.add('go'));
    $$('[data-w]',root).forEach((b,i)=>{b.style.transitionDelay=(i*50)+'ms';b.style.width=b.dataset.w});
    $$('[data-count]',root).forEach(countUp);
  }));
}
function countUp(el){
  const to=+el.dataset.count,key=el.dataset.key,from=lastCount[key]??0,sign=el.dataset.sign;lastCount[key]=to;
  const out=v=>(sign&&v>0.004?'+':'')+fmt(v);
  if(reduce||from===to){el.textContent=out(to);return}
  const t0=performance.now(),D=850;
  (function f(t){let p=Math.min(1,(t-t0)/D);p=1-Math.pow(1-p,4);el.textContent=out(from+(to-from)*p);if(p<1)requestAnimationFrame(f)})(t0);
}

let sw=null;
function closeSwipes(except){$$('.swipe-front').forEach(f=>{if(f!==except&&f._open){f._open=false;f.style.transform=''}})}
document.addEventListener('pointerdown',e=>{
  if(ctx)return;const f=e.target.closest('.swipe-front');closeSwipes(f);if(!f||e.button>0)return;
  sw={f,x:e.clientX,y:e.clientY,base:f._open?-88:0,dx:0,lock:null};
});
document.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(sw.lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))sw.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(sw.lock==='x'){let v=sw.base+dx;if(v>0)v=v*.2;if(v<-88)v=-88+(v+88)*.3;sw.f.style.transition='none';sw.f.style.transform=`translateX(${v}px)`;sw.dx=dx}
});
function endSwipe(){
  if(!sw)return;
  if(sw.lock==='x'){const open=sw.base+sw.dx<-44;sw.f._open=open;sw.f.style.transition='';sw.f.style.transform=open?'translateX(-88px)':'';sw.f._just=true;const f=sw.f;setTimeout(()=>f._just=false,60)}
  sw=null;
}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',()=>{if(sw){sw.f.style.transition='';sw.f.style.transform=sw.f._open?'translateX(-88px)':''}sw=null});

    case 'sheet-save':saveSheet();break;
    case 'sheet-delete':{const {kind,id}=ctx;closeSheet();setTimeout(()=>removeItem(kind,id,null),250);break}
    case 'undo':if(undoBuf){listOf(undoBuf.kind).splice(undoBuf.i,0,undoBuf.it);save();undoBuf=null;render();toast('Ripristinato')}break;
    case 'clear-sample':['expenses','savings','extras','planned'].forEach(k=>S[k]=S[k].filter(x=>!x.sample));if(S.sample){S.salaries={};prevSal={}}S.sample=false;save();animate=true;render();toast('Pronto, ora i dati sono solo tuoi');break;
    case 'wipe':if(!wipeArmed){wipeArmed=true;a.textContent='Tocca di nuovo per cancellare tutto';clearTimeout(wipeTimer);wipeTimer=setTimeout(()=>{wipeArmed=false;const b=$('[data-action="wipe"]');if(b)b.textContent='Cancella tutti i dati'},4000);return}
      wipeArmed=false;S=defaults();save();animate=true;render();toast('Tutti i dati sono stati cancellati');break;
    case 'export':{const json=JSON.stringify({app:'Tasca',version:1,exported:new Date().toISOString(),data:{expenses:S.expenses,savings:S.savings,extras:S.extras,salaries:S.salaries,planned:S.planned,settings:S.settings}});
      const box=$('#export-box'),ta=$('#export-text');ta.value=json;box.hidden=false;
      const sel=()=>{ta.focus();ta.select();toast('Seleziona e copia il testo del backup')};
      try{navigator.clipboard.writeText(json).then(()=>toast('Backup copiato negli appunti'),sel)}catch(_){sel()}
      try{const u=URL.createObjectURL(new Blob([json],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=`tasca-backup-${todayISO()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(_){}
      break}
    case 'import-text':askImport($('#imp-text').value);break;
    case 'import-cancel':pendingImport=null;render();break;
    case 'import-ok':S={...defaults(),...pendingImport,sample:false};pendingImport=null;save();animate=true;render();toast('Backup ripristinato');break;
  }
}

const h=location.hash.slice(1);if(SCREENS[h])tab=h;
const auto0=processDue();
render();
initSync();
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
if(auto0)setTimeout(()=>toast(auto0===1?'Registrata 1 spesa programmata':`Registrate ${auto0} spese programmate`),600);
let lastDay=todayISO();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&todayISO()!==lastDay){lastDay=todayISO();const n=processDue();if(!ctx)render();if(n)toast(`Registrate ${n} spese programmate`)}});
})();
</script>
